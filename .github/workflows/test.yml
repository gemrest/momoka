name: 💜 Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          gleam-version: "1.19.2"
      - run: gleam deps download
      - run: gleam test
      - run: gleam format --check src test
